version: "3.9"

services:
  queue-service:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: queue-service

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: development
      PORT: 3000
      SERVICE_NAME: spotq-queue-service
      LOG_LEVEL: info

      DATABASE_URL: ${DATABASE_URL}

      REDIS_URL: ${REDIS_URL}

    networks:
      - spotq-network

networks:
  spotq-network:
    driver: bridge
