version: "3.9"

services:
  queue-service:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: queue-service

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: development
      PORT: 3000
      SERVICE_NAME: spotq-queue-service
      LOG_LEVEL: info

      DATABASE_URL: ${DATABASE_URL}

      REDIS_URL: redis://redis:6379

    depends_on:
      - redis

    networks:
      - spotq-network

  redis:
    image: redis:7-alpine

    container_name: redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    networks:
      - spotq-network

volumes:
  redis-data:

networks:
  spotq-network:
    driver: bridge
